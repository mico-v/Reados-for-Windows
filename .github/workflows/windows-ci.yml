name: MSP verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      reference_url:
        description: "Verified MSP Windows preview ZIP URL (optional; used by reference job)"
        required: false
        type: string
      reference_sha256:
        description: "SHA-256 for reference_url"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: msp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify-windows:
    name: ReadOS Windows runtime and bindings
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Cargo and NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            ~\.nuget\packages
          key: ${{ runner.os }}-deps-${{ hashFiles('native/**/Cargo.lock', '**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Verify native, managed, and solution gates
        shell: pwsh
        run: .\scripts\verify-msp.ps1

      - name: Verify capability manifest and source boundary
        if: ${{ hashFiles('MSP/Implementations/Windows/Cargo.toml') != '' }}
        shell: pwsh
        run: .\scripts\verify-msp-capability-manifest.ps1

      - name: Build public FFI release DLL
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=/Brepro"
        run: cargo build --release --locked --manifest-path native/msp-ffi/Cargo.toml

      - name: Prepare CI-local FFI release metadata
        shell: pwsh
        run: |
          $metadata = Get-Content -Raw -LiteralPath native\msp-ffi\release-metadata.json | ConvertFrom-Json
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            function Get-Sha256([string] $path) {
              $bytes = $sha256.ComputeHash([System.IO.File]::ReadAllBytes($path))
              return ([System.BitConverter]::ToString($bytes) -replace '-', '').ToLowerInvariant()
            }
            $metadata.hashes.manifest = Get-Sha256 'native\msp-ffi\Cargo.toml'
            $metadata.hashes.header = Get-Sha256 'native\msp-ffi\include\msp_ffi.h'
            $metadata.hashes.export_definition = Get-Sha256 'native\msp-ffi\exports\msp_ffi.def'
            $metadata.hashes.dll = Get-Sha256 'native\msp-ffi\target\release\msp_ffi.dll'
          }
          finally {
            $sha256.Dispose()
          }
          $metadata | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath "$env:RUNNER_TEMP\msp-ffi-release-metadata.json" -Encoding utf8NoBOM

      - name: Verify public FFI release contract
        shell: pwsh
        run: >-
          .\scripts\verify-msp-ffi-release.ps1
          -DllPath native\msp-ffi\target\release\msp_ffi.dll
          -ManifestPath native\msp-ffi\Cargo.toml
          -HeaderPath native\msp-ffi\include\msp_ffi.h
          -ExportDefinitionPath native\msp-ffi\exports\msp_ffi.def
          -MetadataPath $env:RUNNER_TEMP\msp-ffi-release-metadata.json

      - name: Run .NET FFI consumer tests against the verified DLL
        shell: pwsh
        env:
          MSP_FFI_NATIVE_DLL: ${{ github.workspace }}\native\msp-ffi\target\release\msp_ffi.dll
        run: dotnet test native/msp-ffi/bindings/dotnet/tests/consumer/MspFfi.Consumer.Tests.csproj -c Release --nologo

      - name: Run Node binding tests
        shell: pwsh
        run: npm test --prefix native/msp-ffi/bindings/node

      - name: Configure and build C++ binding smoke
        shell: pwsh
        run: |
          cmake -S native/msp-ffi/bindings/cpp -B native/msp-ffi/bindings/cpp/build -DBUILD_TESTING=ON
          cmake --build native/msp-ffi/bindings/cpp/build --config Release
          ctest --test-dir native/msp-ffi/bindings/cpp/build -C Release --output-on-failure

      - name: Report external evidence availability
        shell: pwsh
        run: |
          .\scripts\verify-msp-ffi-multiarch.ps1 -Json
          .\scripts\verify-debian-pty-oracle.ps1 -Json

      - name: Check patch whitespace
        shell: bash
        run: git diff --check

  verify-ffi-cross-targets:
    name: Public FFI ${{ matrix.rid }} cross-build
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x86
            target: i686-pc-windows-msvc
          - rid: win-arm64
            target: aarch64-pc-windows-msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build public FFI for target
        id: build-target
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=/Brepro"
        run: cargo build --release --locked --manifest-path native/msp-ffi/Cargo.toml --target ${{ matrix.target }}

      - name: Report target evidence
        if: always()
        shell: pwsh
        run: |
          $dll = "native\msp-ffi\target\${{ matrix.target }}\release\msp_ffi.dll"
          if (Test-Path -LiteralPath $dll -PathType Leaf) {
            Write-Host "${{ matrix.rid }} artifact available: $dll"
          }
          else {
            Write-Warning "${{ matrix.rid }} remains blocked: target build did not produce $dll"
          }

      - name: Publish cross-build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-ffi-${{ matrix.rid }}
          path: native/msp-ffi/target/${{ matrix.target }}/release/msp_ffi.dll
          if-no-files-found: ignore

  verify-native-ubuntu:
    name: Native contract checks on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Validate portable manifests and fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('conformance/msp-upstream').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY
          cargo metadata --manifest-path native/msp-core/Cargo.toml --no-deps --format-version 1 >/dev/null
          cargo metadata --manifest-path native/msp-ffi/Cargo.toml --no-deps --format-version 1 >/dev/null

  verify-reference-windows:
    name: MSP Windows reference workspace
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_url != '' && inputs.reference_sha256 != '' }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download verified MSP reference archive
        shell: pwsh
        env:
          REFERENCE_URL: ${{ inputs.reference_url }}
          REFERENCE_SHA256: ${{ inputs.reference_sha256 }}
        run: |
          New-Item -ItemType Directory -Force -Path .ci\downloads | Out-Null
          Invoke-WebRequest -Uri $env:REFERENCE_URL -OutFile .ci\downloads\msp-reference.zip
          $actual = (Get-FileHash .ci\downloads\msp-reference.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:REFERENCE_SHA256.ToLowerInvariant()) {
            throw "Reference archive SHA-256 mismatch. expected=$env:REFERENCE_SHA256 actual=$actual"
          }

      - name: Prepare ignored reference tree
        shell: pwsh
        env:
          REFERENCE_SHA256: ${{ inputs.reference_sha256 }}
        run: |
          python scripts/prepare-msp-reference.py --archive .ci\downloads\msp-reference.zip --destination MSP --sha256 $env:REFERENCE_SHA256

      - name: Build and test the reference Windows workspace
        shell: pwsh
        working-directory: MSP\Implementations\Windows
        run: |
          cargo fetch --locked --manifest-path ..\Swift\Sources\Tools\Vendor\Codex\apply_patch\Source\msp-codex-apply-patch-bridge\Cargo.toml
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo build --workspace --locked

      - name: Validate reference and ReadOS provenance boundaries
        shell: pwsh
        run: .\scripts\verify-msp-capability-manifest.ps1

      - name: Upload reference test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msp-reference-cargo-logs
          path: |
            MSP/Implementations/Windows/target/**/*.log
            MSP/Implementations/Windows/Cargo.lock
          if-no-files-found: ignore
