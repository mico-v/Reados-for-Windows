[package]
name = "msp-process-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ReadOS-owned bounded Windows/Linux process backend for verified providers."
repository = "https://github.com/mico-v/reados"
readme = "README.md"
include = ["Cargo.toml", "README.md", "NOTICE", "LICENSE-APACHE-2.0", "src/**"]

[dependencies]
msp-backend = { path = "../msp-backend", version = "0.1.0" }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
