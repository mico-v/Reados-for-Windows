[package]
name = "msp-web-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Loopback HTTP host for the ReadOS portable MSP runtime."
repository = "https://github.com/mico-v/reados"
readme = "README.md"

[dependencies]
msp-backend = { path = "../msp-backend", version = "0.1.0" }
msp-command-pack = { path = "../msp-command-pack", version = "0.1.0" }
msp-command-runtime = { path = "../msp-command-runtime", version = "0.1.0" }
msp-kernel = { path = "../msp-kernel", version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12.1", features = ["json"] }

[[bin]]
name = "reados-msp-web"
path = "src/main.rs"
