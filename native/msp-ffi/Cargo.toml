[package]
name = "msp-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Small public C ABI foundation for the ReadOS MSP core."
build = "build.rs"
exclude = [
    "bindings/**/bin/**",
    "bindings/**/obj/**",
    "bindings/**/node_modules/**",
    "bindings/**/TestResults/**",
]

[lib]
name = "msp_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
msp-core = { path = "../msp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
