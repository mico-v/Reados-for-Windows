[package]
name = "msp-protocol-windows"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ReadOS-owned, platform-neutral Windows MSP protocol boundary."
repository = "https://github.com/mico-v/reados"

[dependencies]
msp-kernel = { path = "../msp-kernel", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
