[package]
name = "msp-command-pack"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ReadOS-owned deterministic virtual-workspace command pack."
repository = "https://github.com/mico-v/reados"
readme = "README.md"
include = ["Cargo.toml", "README.md", "NOTICE", "LICENSE-APACHE-2.0", "profile/**", "src/**"]

[dependencies]
msp-backend = { path = "../msp-backend", version = "0.1.0" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
